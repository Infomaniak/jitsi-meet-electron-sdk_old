name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.build-group }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest now ships Visual Studio 18 (2026), which the
          # node-gyp bundled with Node 20 cannot detect
          # ("unknown version \"undefined\""); pin the VS 2022 image so the
          # native win32 prebuilds keep building.
          - os: windows-2022
            arch: x86
            build-group: win32-x86
          - os: windows-2022
            arch: x64
            build-group: win32-x64
          - os: windows-11-arm
            arch: arm64
            build-group: win32-arm64
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '20'
        architecture: ${{ matrix.arch }}
    - run: npm ci
    - name: Prebuildify
      run: npm run prebuild
      shell: bash
    - uses: actions/upload-artifact@v6
      with:
        name: prebuilds-${{ matrix.build-group }}
        path: prebuilds/
  publish:
    name: Publish to npm
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: ${{ github.ref }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v7
      with:
        path: prebuilds
        pattern: prebuilds-*
        merge-multiple: true
    - uses: actions/setup-node@v6
      with:
        node-version: '20'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@infomaniak'
    - run: npm publish --registry https://npm.pkg.github.com
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
