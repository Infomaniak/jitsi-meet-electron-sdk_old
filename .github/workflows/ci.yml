name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.build-group }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The win32-arm64 prebuild is cross-compiled in the x64 job below:
          # the windows-11-arm runner now ships only Visual Studio 18 (2026),
          # which the node-gyp bundled with Node 20 cannot detect
          # (nodejs/node-gyp#3282, "unknown version \"undefined\"").
          - os: windows-2022
            arch: x86
            build-group: win32-x86
          - os: windows-2022
            arch: x64
            build-group: win32-x64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
      with:
        node-version: '20'
        architecture: ${{ matrix.arch }}
    - run: npm ci
    - run: npm run lint
    - run: npm test
    - name: Prebuildify
      run: npm run prebuild
      shell: bash
    # Cross-compile the win32-arm64 prebuild with the VS 2022 ARM64 toolset.
    # continue-on-error: if the ARM64 toolset is unavailable, the release
    # still ships with the x86/x64 prebuilds instead of blocking the publish.
    - name: Prebuildify (win32-arm64 cross-compile)
      if: matrix.arch == 'x64'
      run: npm run prebuild -- --arch arm64
      shell: bash
      continue-on-error: true
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: prebuilds-${{ matrix.build-group }}
        path: prebuilds/
  publish:
    name: Publish to npm
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: ${{ github.ref }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        path: prebuilds
        pattern: prebuilds-*
        merge-multiple: true
    - uses: jitsi/gh-actions/npm-version-bump@6ea91f36593d6a041528b2bf5af1cf667888f48e  # npm-version-bump/v1.0.1
    # Writes the .npmrc auth entry for npm.pkg.github.com; without it
    # `npm publish` fails with ENEEDAUTH even with NODE_AUTH_TOKEN set.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
      with:
        node-version: '20'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@infomaniak'
    - run: npm publish --registry https://npm.pkg.github.com
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
